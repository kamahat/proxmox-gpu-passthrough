# Sanitized VM config — RTX 5070 (Blackwell GB205) passthrough to Ubuntu 26.04
# Generated from: qm config <vmid>
#
# Key passthrough line: hostpci0 passes ONLY the GPU function (03:00.0)
# NOT the audio companion (03:00.1). This forces QEMU to use FLR instead of
# Secondary Bus Reset, preventing Blackwell WPR2 re-arm between VM starts.
#
# See: docs/vendors/nvidia-rtx50-blackwell.md

agent: 1,fstrim_cloned_disks=1
balloon: 0
bios: ovmf
boot: order=virtio0;net0
cores: 6
cpu: host
efidisk0: local-lvm:vm-100-disk-0,efitype=4m,size=4M
hostpci0: 0000:03:00.0,pcie=1,rombar=0
machine: q35
memory: 16384
net0: virtio=00:00:5E:00:53:01,bridge=vmbr0
numa: 0
onboot: 1
ostype: l26
vga: none
virtio0: local-lvm:vm-100-disk-1,cache=writeback,iothread=1,size=20G
